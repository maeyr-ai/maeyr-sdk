[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "viksa-ai"
version = "0.2.4"
description = "Viksa AI platform SDK: agent runtime, dev tooling, and HTTP client"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "Viksa AI", email = "support@viksaai.com" }]
keywords = ["viksa", "ai", "agents", "mcp", "sdk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
mcp = [
    "mcp>=1.6.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
    "build>=1.0.0",
    "mcp>=1.6.0",
]

[project.scripts]
viksa-agent-validate = "viksa_ai.devtools.cli:main"
viksa-mcp-bridge = "viksa_ai.mcp_bridge.cli:main"

[project.urls]
Homepage = "https://viksaai.com"
Documentation = "https://docs.viksaai.com"
Repository = "https://github.com/viksa-ai/viksa-sdk"
Issues = "https://github.com/viksa-ai/viksa-sdk/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
viksa_ai = ["runtime/_canonical_viksai.txt"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.coverage.run]
source = ["viksa_ai"]

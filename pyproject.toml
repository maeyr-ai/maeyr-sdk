[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maeyr"
version = "0.2.8"
description = "Maeyr platform SDK: agent runtime, dev tooling, and HTTP client"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Maeyr", email = "support@maeyr.com" }]
keywords = ["maeyr", "ai", "agents", "mcp", "sdk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
mcp = [
    "mcp>=1.6.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
    "mypy>=1.11.0,<2",
    "build>=1.0.0",
    "mcp>=1.6.0",
]

[project.scripts]
maeyr-agent-validate = "maeyr.devtools.cli:main"
maeyr-mcp-bridge = "maeyr.mcp_bridge.cli:main"

[project.urls]
Homepage = "https://maeyr.com"
Documentation = "https://docs.maeyr.com"
Repository = "https://github.com/maeyr-ai/maeyr-sdk"
Issues = "https://github.com/maeyr-ai/maeyr-sdk/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
maeyr = ["py.typed", "runtime/_canonical_maeyr.txt"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/maeyr"]
show_error_codes = true
show_error_context = true
pretty = true
warn_unused_configs = true

[tool.coverage.run]
source = ["maeyr"]

# Adapted from https://github.com/Srirammkm/jsonQ (.github/workflows/build-and-publish.yaml.bkp)
# Publishes only the public maeyr SDK. The application-only platform runtime
# is deliberately excluded from every package-registry publishing path.

name: Build and Publish maeyr to PyPI

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-before-release:
    name: Pre-release tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: |
          ruff check src tests
          ruff format --check src tests

      - name: Pytest
        run: pytest --cov=maeyr --cov-report=term-missing

      - name: Validate package import
        run: |
          python -c "
          from maeyr.client import MaeyrClient
          from maeyr.runtime.inject import to_module_source
          assert to_module_source()
          print('Package structure OK')
          "

  build-and-publish:
    name: Build and publish
    runs-on: ubuntu-latest
    needs: test-before-release
    if: >
      (github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'release' && github.event.action == 'published'))
    environment: pypi
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: python -m build

      - name: Check distributions
        run: |
          twine check dist/*
          python scripts/verify_public_sdk_distribution.py dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Optional: set repository secret PYPI_API_TOKEN (see PYPI_PUBLISHING.md).
          # When PyPI trusted publishing is configured for this repo, omit the token.
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true

  sync-release-tag:
    name: Sync git release tag
    runs-on: ubuntu-latest
    needs: build-and-publish
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create and push version tag
        run: |
          VERSION=$(python -c "import tomllib; f=open('pyproject.toml','rb'); print(tomllib.load(f)['project']['version'])")
          TAG="v${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; skipping."
            exit 0
          fi
          git tag -a "$TAG" -m "Release ${TAG} (PyPI maeyr ${VERSION})"
          git push origin "$TAG"

  post-release-validation:
    name: Post-release smoke test
    runs-on: ubuntu-latest
    needs: build-and-publish
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Wait for PyPI index propagation
        run: sleep 120

      - name: Install from PyPI and smoke test
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          pip install "maeyr==${VERSION}"
          python -c "
          from maeyr.client import MaeyrClient
          import maeyr
          print('Installed maeyr', maeyr.__version__ if hasattr(maeyr, '__version__') else VERSION)
          "

# Publishes the official maeyr Python SDK to PyPI and GitHub Releases.

name: Build and Publish maeyr to PyPI

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  test-before-release:
    name: Pre-release tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install -e "packages/maeyr-platform-runtime[dev]"
          pip install ruff==0.15.16 pip-audit==2.10.1

      - name: Ruff
        run: |
          ruff check src tests
          ruff format --check src tests

      - name: Pytest
        run: PYTHONPATH=. pytest --cov=maeyr --cov-report=term-missing

      - name: Private platform runtime source and regression gate
        run: |
          ruff check packages/maeyr-platform-runtime/src packages/maeyr-platform-runtime/tests
          PYTHONPATH=packages/maeyr-platform-runtime/src \
            python -m pytest -q packages/maeyr-platform-runtime/tests

      - name: Public and private dependency security gate
        run: |
          python - <<'PY'
          import pathlib
          import tomllib

          output = pathlib.Path("/tmp/maeyr-release-requirements.txt")
          roots = (pathlib.Path("pyproject.toml"),
                   pathlib.Path("packages/maeyr-platform-runtime/pyproject.toml"),
                   pathlib.Path("packages/maeyr-serverless-common/pyproject.toml"))
          dependencies = []
          for root in roots:
              with root.open("rb") as stream:
                  project = tomllib.load(stream)["project"]
              dependencies.extend(project["dependencies"])
              dependencies.extend(project.get("optional-dependencies", {}).get("mcp", []))
          output.write_text("\n".join(dependencies) + "\n", encoding="utf-8")
          PY
          python -m pip_audit --strict -r /tmp/maeyr-release-requirements.txt

      - name: Private serverless contracts regression gate
        env:
          SERVERLESS_TEST_REDIS_URL: redis://127.0.0.1:63719/0
        run: |
          python -m pip install -e packages/maeyr-serverless-common
          docker run --detach --name maeyr-serverless-common-test-redis \
            --publish 127.0.0.1:63719:6379 \
            redis@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99 \
            redis-server --appendonly yes --appendfsync always --maxmemory-policy noeviction
          for attempt in $(seq 1 30); do
            if docker exec maeyr-serverless-common-test-redis redis-cli ping | grep -q PONG; then
              break
            fi
            sleep 1
          done
          docker exec maeyr-serverless-common-test-redis redis-cli ping | grep -q PONG
          ruff check packages/maeyr-serverless-common/src packages/maeyr-serverless-common/tests
          python -m pytest -q packages/maeyr-serverless-common/tests

      - name: Remove isolated serverless contracts Redis
        if: always()
        run: docker rm --force maeyr-serverless-common-test-redis || true

      - name: Validate package import
        run: |
          python -c "
          from maeyr.client import MaeyrClient
          from maeyr.runtime.inject import to_module_source
          assert to_module_source()
          print('Package structure OK')
          "

  build-and-publish:
    name: Build and publish
    runs-on: ubuntu-latest
    needs: test-before-release
    if: >
      (github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'release' && github.event.action == 'published'))
    environment: pypi
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: python -m build

      - name: Check distributions
        run: |
          twine check dist/*
          python scripts/verify_public_sdk_distribution.py dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Optional: set repository secret PYPI_API_TOKEN (see PYPI_PUBLISHING.md).
          # When PyPI trusted publishing is configured for this repo, omit the token.
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true

      - name: Create GitHub Release and Upload Distribution Assets
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
          generate_release_notes: true

  sync-release-tag:
    name: Sync git release tag
    runs-on: ubuntu-latest
    needs: build-and-publish
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create and push version tag
        run: |
          VERSION=$(python -c "import tomllib; f=open('pyproject.toml','rb'); print(tomllib.load(f)['project']['version'])")
          TAG="v${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; skipping."
            exit 0
          fi
          git tag -a "$TAG" -m "Release ${TAG} (PyPI maeyr ${VERSION})"
          git push origin "$TAG"

  post-release-validation:
    name: Post-release smoke test
    runs-on: ubuntu-latest
    needs: build-and-publish
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Wait for PyPI index propagation
        run: sleep 120

      - name: Install from PyPI and smoke test
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          pip install "maeyr==${VERSION}"
          python -c "
          from maeyr.client import MaeyrClient
          import maeyr
          print('Installed maeyr', maeyr.__version__ if hasattr(maeyr, '__version__') else VERSION)
          "

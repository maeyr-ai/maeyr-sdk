name: Publish platform runtime to PyPI

on:
  push:
    tags:
      - "platform-runtime-v*"

permissions:
  contents: read

jobs:
  build:
    name: Test and build immutable distributions
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/viksa-platform-runtime
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Require an exact package tag
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib

          prefix = "platform-runtime-v"
          tag = os.environ["RELEASE_TAG"]
          with open("pyproject.toml", "rb") as project_file:
              project = tomllib.load(project_file)["project"]
          name = project["name"]
          version = project["version"]
          expected_tag = f"{prefix}{version}"
          if name != "viksa-platform-runtime":
              raise SystemExit(f"refusing unexpected distribution name: {name!r}")
          if tag != expected_tag:
              raise SystemExit(f"release tag {tag!r} must equal {expected_tag!r}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={version}\n")
          PY

      - name: Install package and release gates
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Quality gates
        run: |
          ruff check src tests
          ruff format --check src tests
          mypy
          pytest

      - name: Build from clean tagged source
        run: python -m build

      - name: Verify immutable release artifacts
        run: |
          python -m twine check dist/*
          python ../../scripts/verify_python_release.py \
            --project-directory . \
            --dist-directory dist \
            --expected-name viksa-platform-runtime \
            --expected-version "${{ steps.release.outputs.version }}"

      - name: Upload verified distributions
        uses: actions/upload-artifact@v4
        with:
          name: viksa-platform-runtime-${{ steps.release.outputs.version }}
          path: packages/viksa-platform-runtime/dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish verified distributions
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: pypi-platform-runtime
      url: https://pypi.org/p/viksa-platform-runtime
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@v4
        with:
          name: viksa-platform-runtime-${{ needs.build.outputs.version }}
          path: dist

      - name: Publish to production PyPI with OIDC
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  validate-index:
    name: Validate production index installation
    runs-on: ubuntu-latest
    needs: [build, publish]
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install exact release from production PyPI
        run: |
          python -m pip install --disable-pip-version-check \
            --index-url https://pypi.org/simple \
            --no-cache-dir \
            "viksa-platform-runtime==${{ needs.build.outputs.version }}"

      - name: Verify installed version and PEP 561 marker
        env:
          EXPECTED_VERSION: ${{ needs.build.outputs.version }}
        run: |
          python - <<'PY'
          import importlib.metadata
          import os
          from pathlib import Path

          import viksa_platform

          expected = os.environ["EXPECTED_VERSION"]
          installed = importlib.metadata.version("viksa-platform-runtime")
          marker = Path(viksa_platform.__file__).with_name("py.typed")
          if installed != expected:
              raise SystemExit(f"installed {installed!r}; expected {expected!r}")
          if not marker.is_file():
              raise SystemExit(f"missing PEP 561 marker: {marker}")
          print(f"validated viksa-platform-runtime=={installed} from production PyPI")
          PY

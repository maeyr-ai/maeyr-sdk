name: CI

on:
  push:
    branches: [main, maeyr-migration]
  pull_request:
    branches: [main, maeyr-migration]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" -e "packages/maeyr-platform-runtime[dev]"

      - name: Ruff
        run: |
          ruff check src tests
          ruff format --check src tests

      - name: Pytest
        run: PYTHONPATH=. pytest --cov=maeyr --cov-report=term-missing

      - name: Build and verify public distributions
        if: matrix.python-version == '3.12'
        run: |
          python -m build
          python scripts/verify_public_sdk_distribution.py dist

  platform-runtime:
    name: Platform runtime / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/maeyr-platform-runtime
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and development gates
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff
        run: |
          ruff check src tests
          ruff format --check src tests

      - name: Strict typing
        run: mypy

      - name: Pytest
        run: pytest

      - name: Build and verify distributions
        run: |
          python -m build
          python -m twine check dist/*
          python ../../scripts/verify_python_release.py \
            --project-directory . \
            --dist-directory dist \
            --expected-name maeyr-platform-runtime

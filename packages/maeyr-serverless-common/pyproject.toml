[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maeyr-serverless-common"
version = "0.1.0"
description = "Private canonical Serverless wire, fleet and financial contracts"
requires-python = ">=3.11"
classifiers = ["Private :: Do Not Upload"]
dependencies = ["httpx>=0.28,<1", "redis>=5,<7", "pydantic>=2.10,<3", "temporalio==1.31.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
maeyr_serverless_common = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

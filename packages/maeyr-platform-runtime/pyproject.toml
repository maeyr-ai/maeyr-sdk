[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maeyr-platform-runtime"
version = "0.2.1"
description = "Typed cross-cutting runtime contracts for Maeyr platform services"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Maeyr", email = "support@maeyr.com" }]
classifiers = [
    "Private :: Do Not Upload",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "aiohttp>=3.9,<4",
    "async-timeout>=4,<6",
    "fastapi>=0.104,<1",
    "httpx>=0.25,<1",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "python-json-logger>=2,<5",
    "uvicorn>=0.24,<1",
    "uvloop>=0.19,<1; platform_system != 'Windows'",
]

[project.optional-dependencies]
dev = [
    "build>=1.0.0",
    "mypy>=1.11.0,<2",
    "pytest>=8.0.0,<9",
    "pytest-asyncio>=0.23.0,<1",
    # Redis is an optional runtime integration, but strict type checking must
    # resolve the deliberately lazy ``redis.asyncio`` import.
    "redis>=5,<6",
    "ruff>=0.4.0",
    "setuptools>=77",
    "tomli>=2; python_version < '3.11'",
    "twine>=5,<7",
    "wheel>=0.43",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
maeyr_platform = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests"]
show_error_codes = true
show_error_context = true
pretty = true
warn_unused_configs = true

[tool.coverage.run]
source = ["maeyr_platform"]
